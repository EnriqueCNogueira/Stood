# CI: confere typecheck, migrations, testes e build em todo PR
name: CI

# Aciona CI em todo PR
on:
  pull_request:

# Novo commit no PR cancela o CI anterior
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Postgres descartável do CI
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stood
          POSTGRES_PASSWORD: stood
          POSTGRES_DB: stood
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Simula a env de produção
    env:
      DATABASE_URL: postgres://stood:stood@localhost:5432/stood
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Migrations
        run: pnpm exec drizzle-kit migrate

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build
